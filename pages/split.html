<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Split PDF</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div id="header"></div>

    <main class="tool-page">
        <h2 data-testid="page-title">Split PDF</h2>
        <a href="/index.html" class="home-link" data-testid="back-home">← Back to Home</a>

        <!-- Upload block -->
        <div class="upload-block">

            <input type="file" id="file" accept="application/pdf" style="display:none!important;">

            <!-- Drop zone -->
            <div id="dropZone" class="drop-zone">
                <div class="drop-content">
                    <div class="drop-icon">📄</div>
                    <p><strong>Drag & drop PDF here</strong></p>
                    <p>or</p>
                    <label for="file" class="file-btn">Choose PDF file</label>
                </div>
            </div>

            <!-- File preview -->
            <div id="filePreview" class="file-card" style="display:none;">
                <div class="file-icon">📄</div>

                <div class="file-info">
                    <strong id="fileName"></strong>
                    <span id="fileSize"></span>
                </div>

                <div class="file-actions">
                    <button title="Remove file" id="removeFileBtn">
                        <svg width="16" height="16" viewBox="0 0 24 24">
                            <path d="M6 6l12 12M18 6L6 18"
                                  stroke="currentColor"
                                  stroke-width="2"
                                  stroke-linecap="round"/>
                        </svg>
                    </button>
                </div>
            </div>

            <!-- Page range -->
            <div class="split-range">
                <label>
                    From page
                    <input type="number" id="from" min="1" value="1">
                </label>
                <label>
                    To page
                    <input type="number" id="to" min="1" value="1">
                </label>
            </div>

            <button id="splitBtn">Split PDF</button>
        </div>

        <!-- Result -->
        <div id="resultContainer" style="display:none; margin-top:20px;">
            <div class="upload-block">
                <p>
                    <a id="downloadLink" href="#" download class="btn">Download splitted PDF</a>
                </p>
                <iframe id="previewFrame" title="Splitted PDF" width="100%" height="500px"></iframe>
            </div>
        </div>
    </main>

    <div id="footer"></div>

    <script src="/js/main.js"></script>
    <script type="module" src="/js/pages/splitPage.js"></script>
</body>
</html>
