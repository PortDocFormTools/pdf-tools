<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Merge PDF</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div id="header"></div>

    <main class="tool-page">
        <h2 data-testid="page-title">Merge PDF</h2>
        <a href="/index.html" class="home-link" data-testid="back-home">← Back to Home</a>

        <!-- Upload block -->
        <div class="upload-block">

            <input type="file" id="files" accept="application/pdf" multiple style="display:none!important;">

            <!-- Drop zone -->
            <div id="dropZone" class="drop-zone">
                <div class="drop-content">
                    <div class="drop-icon">📄</div>
                    <p><strong>Drag & drop PDF files here</strong></p>
                    <p>or</p>
                    <label for="files" class="file-btn">Choose PDF files</label>
                </div>
            </div>

            <!-- Files list -->
            <div id="filesList"></div>

            <button id="mergeBtn">Merge PDFs</button>
        </div>

        <!-- Result -->
        <div id="resultContainer" style="display:none; margin-top:20px;">
            <div class="upload-block">
                <p>
                    <a id="downloadLink" href="#" download class="btn">Download merged PDF</a>
                </p>
                <iframe id="previewFrame" title="Merged PDF" width="100%" height="500px"></iframe>
            </div>
        </div>
    </main>

    <div id="footer"></div>

    <script src="/js/main.js"></script>
    <script type="module" src="/js/pages/mergePage.js"></script>
</body>
</html>
